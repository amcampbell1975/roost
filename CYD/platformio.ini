[platformio]
src_dir = .
default_envs = cyd_mini_usb

[env]
#platform = espressif32
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
extra_scripts = pre:convert_images.py
lib_deps = 
	bodmer/TFT_eSPI@^2.5.33
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	https://github.com/buelowp/sunset
	PubSubClient
	bblanchon/ArduinoJson @ ^7.0.0
	#NTPClient
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions=min_spiffs.csv
build_flags =
	-DUSER_SETUP_LOADED
	-DILI9341_2_DRIVER
	-DUSE_HSPI_PORT
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF

; USB envs: use for the first flash of a board (and as a fallback if OTA ever breaks).
[env:cyd_mini_usb]
build_flags =
	${env.build_flags}
	-DTFT_INVERSION_OFF
	-DDEVICE_NAME=roostcyd1

[env:cyd2_usbC]
build_flags =
	${env.build_flags}
	-DTFT_INVERSION_ON
	-DDEVICE_NAME=roostcyd2

; OTA envs: same firmware, uploaded over WiFi.  pio run -e cyd_mini_ota -t upload
; No password: keep the boards on the local network only.
[env:cyd_mini_ota]
extends = env:cyd_mini_usb
upload_protocol = espota
upload_port = roostcyd1.local

[env:cyd2_ota]
extends = env:cyd2_usbC
upload_protocol = espota
; upload_port = roostcyd2.local
upload_port = 192.168.1.131

